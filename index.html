  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    function addTimeStamps() {
      const toks = window.location.href.split('?t=');
      const t = (!toks[1] || isNaN(toks[1])) ? 0 : parseInt(toks[1]);
      const now = (new Date()).getTime();
      const diff = now - t;
      const maxDiff = 1000 * 60; // 1 minute
      if (diff > maxDiff) {
        // reload with fresh HTML
        window.location.href = toks[0] + '?t=' + now;
      } else {
        // Make sure all links use dummy argument to prevent cache
        document.querySelectorAll('a').forEach(a => a.href += '?t=' + t);
      }
    }
    setTimeout(addTimeStamps, 20);
  </script>
